name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject src/demo
        shell: bash
        run: |
          if [[ -e src/demo || -L src/demo ]]; then
            echo "::error file=src/demo::src/demo must not be present in this repository."
            exit 1
          fi

          echo "src/demo is absent."
